# Training reads an offline cache with READY.json, safetensors shards and manifest.jsonl.
# Each dict must set mode: gen_image and omit attention_mask for SLA.
model_path: /mnt/share/r50063443/HunyuanImage-3.0-Instruct-Distil
# Offline latent training never calls the VAE or conditional-image ViT.
skip_load_modules:
  - vae
  - vit
output_dir: results/training/qkvo-delta
# resume_from: results/training/qkvo-delta/sla-step-100
stage: sla
max_steps: 1
# Minimum epoch count. The loop automatically extends it to reach max_steps.
num_epochs: 1
# Set to 0 to save only at the end. ZeRO-3 checkpoints are directories.
save_every_steps: 10
dtype: bf16
learning_rate: 1.0e-4
weight_decay: 0.0
learning_rates:
  proj_l: 1.0e-4
  qkv_delta: 1.0e-5
  o_delta: 1.0e-5
gradient_accumulation_steps: 1
# Each cache record is one complete per-rank batch.
train_micro_batch_size_per_gpu: 1
activation_checkpointing: true
seed: 20260822

data:
  cache_dir: data/cache
  split: train
  num_workers: 0

noise:
  sigma_min: 0.01
  sigma_max: 0.99
  train_timesteps: 1000

conditioning:
  # Official Instruct-Distil generation_config.json uses 2.5; the model embeds 1000 * scale.
  guidance_scale: 2.5

# Only used by ``--stage dense`` to validate model-level diffusion backward.
dense_trainable_patterns:
  - final_layer

sla:
  topk: 0.125
  # Triton hd128/BLKQ64/BLKK128 exceeds the 910C UB limit; 128/128 is backward-capable.
  blkq: 128
  blkk: 128
  use_bf16: true
  # AscendC SLA is inference-only. Triton provides dQ/dK/dV for attention adaptation.
  training_backend: triton
  trainable_components:
    - proj_l
    - qkv_delta
    - o_delta
